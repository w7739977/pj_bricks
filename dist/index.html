<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>田园连连看 · Q版花园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%2348B979'/%3E%3Cpath d='M32 50V27M32 31C20 30 15 22 16 13c10 0 17 5 19 14M32 35c12-1 18-8 17-18-10 0-16 5-18 14' fill='none' stroke='%23FFF8C9' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="/assets/sprites/broccoli.png">
<link rel="preload" as="image" href="/assets/sprites/lettuce.png">
<link rel="preload" as="image" href="/assets/sprites/tomato.png">
<link rel="preload" as="image" href="/assets/sprites/carrot.png">
<link rel="preload" as="image" href="/assets/sprites/corn.png">
<link rel="preload" as="image" href="/assets/sprites/eggplant.png">
<link rel="preload" as="image" href="/assets/sprites/onion.png">
<link rel="preload" as="image" href="/assets/sprites/potato.png">
<link rel="preload" as="image" href="/assets/sprites/cucumber.png">
<link rel="preload" as="image" href="/assets/sprites/pepper.png">
<link rel="preload" as="image" href="/assets/sprites/pumpkin.png">
<link rel="preload" as="image" href="/assets/sprites/grape.png">
<link rel="preload" as="image" href="/assets/sprites/apple.png">
<link rel="preload" as="image" href="/assets/sprites/strawberry.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="game-header">
    <div class="topbar">
    <button class="tool tool--restart tool--compact" id="restartBtn" type="button" aria-label="重试本关">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 9a10 10 0 1 0 1 12"/><path d="M24 4v6h-6"/></svg>
      <span class="sr-only">重试</span>
    </button>
      <h1 class="title">田园连连看</h1>
      <div class="meta" id="meta">第 <span id="level">1</span> 关</div>
    </div>
    <div class="progress-hud">
      <span id="progressValue" class="progress-value">0%</span>
      <div id="progressTrack" class="progress-track" role="progressbar" aria-label="本关消除进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progressFill" class="progress-fill"></span></div>
      <svg class="progress-gift" viewBox="0 0 40 40" aria-hidden="true"><g stroke="#354523" stroke-width="2.2" stroke-linejoin="round"><path d="M6 18h28v17H6Z" fill="#349CFF"/><path d="M4 13h32v8H4Z" fill="#FFC62C"/><path d="M17 13h6v22h-6Z" fill="#F1575A"/><path d="M20 13C3 12 7-2 16 4q4 3 4 9Zm0 0c17-1 13-15 4-9q-4 3-4 9Z" fill="#EF5555"/></g></svg>
    </div>
  </header>

  <p id="tip" class="tip" aria-live="polite"></p>

  <main class="board-wrap">
    <div id="board" class="board" role="grid" aria-label="连连看棋盘"></div>
  </main>

  <nav class="controls" aria-label="工具">
    <button class="tool tool--hint" id="hintBtn" type="button" aria-label="提示，剩余 3 次" aria-describedby="toolAvailability">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 14a6 6 0 1 1 12 0c0 3-2 4-3 6h-6c-1-2-3-3-3-6Z"/><path d="M13 24h6M14 28h4"/></svg>
      <span>提示</span>
      <span class="tool__badge" id="hintCount" aria-hidden="true">3</span>
    </button>
    <button class="tool tool--shuffle" id="shuffleBtn" type="button" aria-label="手动重排，剩余 3 次" aria-describedby="toolAvailability">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9h5c6 0 7 14 13 14h4"/><path d="m23 19 4 4-4 4M5 23h5c2 0 3-2 4-4M20 9h7M23 5l4 4-4 4"/></svg>
      <span>重排</span>
      <span class="tool__badge" id="reshuffleCount" aria-hidden="true">3</span>
    </button>

  </nav>
  <p id="toolAvailability" class="sr-only" aria-live="polite"></p>

  <!-- 关卡完成弹框 -->
  <dialog id="completeDialog" class="dialog dialog--complete" aria-labelledby="completeTitle">
    <div class="dialog__card">
      <div class="dialog__unlock" id="completeUnlock" hidden></div>
      <h2 class="dialog__title" id="completeTitle">关卡完成！</h2>
      <p class="dialog__desc" id="completeDesc"></p>
      <div class="dialog__summary" id="completeSummary"></div>
      <div class="dialog__actions">
        <button class="tool tool--primary" data-complete-next type="button" autofocus>下一关</button>
      </div>
    </div>
  </dialog>

  <!-- 死局弹框 -->
  <dialog id="deadlockDialog" class="dialog dialog--deadlock" aria-labelledby="deadlockTitle">
    <div class="dialog__card">
      <h2 class="dialog__title" id="deadlockTitle">陷入死局</h2>
      <p class="dialog__desc">当前盘面已无可消除对。</p>
      <div class="dialog__actions">
        <button class="tool tool--secondary" data-deadlock-retry type="button">重试本关</button>
        <button class="tool tool--primary" data-deadlock-reshuffle type="button" autofocus>使用一次重排</button>
      </div>
    </div>
  </dialog>

  <!-- 失败或生成错误弹框 -->
  <dialog id="failureDialog" class="dialog dialog--failure" aria-labelledby="failureTitle">
    <div class="dialog__card">
      <h2 class="dialog__title" id="failureTitle">本关失败</h2>
      <p class="dialog__desc" id="failureDesc"></p>
      <div class="dialog__actions">
        <button class="tool tool--primary" data-failure-action type="button" autofocus>重试本关</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="/game/main.js"></script>
</body>
</html>
